name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Exempt from the anti-recursion rule that suppresses push/pull_request events caused by GITHUB_TOKEN, so a GITHUB_TOKEN-authenticated merge (the audit-autofix job's own fix-PR merge, dependabot-auto-merge.yml's auto-merge) can still trigger a real CI/release run by dispatching this explicitly.
  workflow_dispatch:

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: "ci-cd-${{ github.ref }}"
  cancel-in-progress: false

jobs:
  # Commit-message linting. husky's commit-msg hook already enforces this locally before a commit is ever made, so this is a defense-in-depth check (a bypassed hook, or a commit made outside this checkout) rather than the primary gate. Full PR commit range on pull requests; just the latest commit on a direct push, since github.event.before is all-zeros on a branch's first push.
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          task: commitlint
          command: |
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
            else
              pnpm exec commitlint --from HEAD~1 --to HEAD
            fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task: lint
          command: pnpm run lint

      # Workflow YAML linting: the pre-push hook runs this too, but warns and continues when the binary isn't installed locally, so this is the one place it's guaranteed to actually run.
      - name: Lint workflow YAML (actionlint)
        run: |
          VERSION="1.7.12"
          curl -sSfL "https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash" | bash -s -- "$VERSION"
          ./actionlint -color

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task: typecheck
          command: pnpm run typecheck

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task: build
          command: pnpm run build

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task: knip
          command: pnpm run knip

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          task: docs-check
          command: pnpm run docs:check

  # Self-healing: a high-severity advisory with a published, aged-out patch is auto-fixed by pinning a pnpm-workspace.yaml override and opening its own PR, dispatched and merged once that PR's own CI is green; anything not auto-fixable (no patch yet, the fix package itself is too new, a resolution conflict) is deferred and surfaced as a warning, never blocking this run's own release -- matching the original job's advisory-only behaviour.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
    outputs:
      fixed: ${{ steps.audit-setup.outputs.fixed }}
    steps:
      - uses: actions/checkout@v7

      - name: Audit (auto-fix findings with an aged patch, defer the rest)
        id: audit-setup
        uses: ./.github/actions/setup
        with:
          task: audit
          command: node --experimental-strip-types .github/scripts/audit-autofix.ts
        env:
          AUDIT_LEVEL: high

      # Only open a PR from main itself: a PR run has nothing of its own to fix a PR against, and this keeps the fix branch out of branches this workflow doesn't own. Landing the fix through a PR means a bad fix stays off main entirely: the merge below happens only after a full CI run on the fix branch has passed.
      - name: Open a PR with the auto-fixed overrides
        if: steps.audit-setup.outputs.fixed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="audit-autofix/$(date -u +%Y%m%d%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pnpm-workspace.yaml pnpm-lock.yaml
          git commit -m "fix(deps): apply aged security overrides

          $(cat /tmp/audit-fix-commit-body.txt)"
          git push origin "$BRANCH"
          gh pr create --title "fix(deps): apply aged security overrides" --body-file /tmp/audit-fix-commit-body.txt --base main --head "$BRANCH"
          # GitHub treats github-actions[bot] as a first-time contributor, so the PR's own pull_request runs are created in action_required and wait for a person to approve them; the required checks never report and the merge below stays blocked. The code under test is this job's own generated override changes, so it approves those runs itself, scoped to this one branch.
          for i in $(seq 1 6); do
            sleep 10
            for RUN_ID in $(gh run list --branch "$BRANCH" --event pull_request --status action_required --json databaseId --jq '.[].databaseId'); do
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/approve"
            done
          done
          echo "Waiting for the required checks on $BRANCH..."
          for i in $(seq 1 60); do
            STATE=$(gh pr checks "$BRANCH" --required --json bucket --jq '[.[].bucket] | if length == 0 then "pending" elif any(. == "fail" or . == "cancel") then "fail" elif all(. == "pass" or . == "skipping") then "pass" else "pending" end' 2>/dev/null || echo "pending")
            if [ "$STATE" = "pass" ]; then
              echo "Required checks green on $BRANCH, rebase-merging the fix PR."
              gh pr merge --rebase "$BRANCH"
              # A merge authenticated with GITHUB_TOKEN never triggers ci.yml's own push trigger on its own, so dispatch the run for main explicitly.
              gh workflow run ci.yml --ref main
              exit 0
            fi
            if [ "$STATE" = "fail" ]; then
              echo "::error::Required checks on $BRANCH failed; fix PR left open so a broken fix cannot reach main."
              exit 0
            fi
            echo "Required checks on $BRANCH still pending ($i/60)..."
            sleep 20
          done
          echo "::error::Timed out waiting for the required checks on $BRANCH; fix PR left open."
          exit 0

  # Cross-platform test matrix -- the one job that genuinely needs multiple OS/Node combinations. The Build step's turbo cache is keyed by OS only, not Node version, which is correct there since compiled output doesn't depend on the Node runtime -- it's free to share a cache with the standalone build job on the same OS/commit. The test run below gets its own separate cache block keyed by OS *and* Node version, so turbo can't skip actually re-running tests against the second Node version just because the first one already produced a cache entry for the same source inputs.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22.x, 24.x] # 20.x reached end of life 2026-04-30; 18.x removed earlier due to semantic-release compatibility
        include:
          # Test case-sensitive filesystem behavior on macOS (default) and Linux
          - os: ubuntu-latest
            node-version: 22.x
            filesystem-case: sensitive
          - os: macos-latest
            node-version: 22.x
            filesystem-case: insensitive
          # Test Windows path separators and drive letters
          - os: windows-latest
            node-version: 22.x
            filesystem-case: insensitive
            path-separator: backslash
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Configure OS-specific environment
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "Node: ${{ matrix.node-version }}"
          echo "Filesystem case: ${{ matrix.filesystem-case }}"
          echo "Path separator: ${{ matrix.path-separator }}"

          # Set environment variables for cross-platform testing
          echo "MARKMV_TEST_OS=${{ matrix.os }}" >> $GITHUB_ENV
          echo "MARKMV_TEST_CASE_SENSITIVE=${{ matrix.filesystem-case == 'sensitive' }}" >> $GITHUB_ENV
          echo "MARKMV_TEST_PATH_SEP=${{ matrix.path-separator || 'slash' }}" >> $GITHUB_ENV
        shell: bash

      # pnpm must be on PATH before setup-node: its cache integration runs `pnpm store path` and fails if the package manager is not installed yet.
      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      # turbo's local cache for the build step only -- keyed by OS, not Node version, which is correct here since compiled output doesn't vary by Node runtime.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Create filesystem test environment
        run: |
          # Create test directories for cross-platform filesystem testing
          mkdir -p test-filesystem/case-test
          mkdir -p test-filesystem/path-test
          mkdir -p test-filesystem/symlink-test

          # Test case sensitivity (if supported)
          cd test-filesystem/case-test
          echo "lowercase content" > testfile.txt
          echo "uppercase content" > TESTFILE.TXT

          # Count files to detect case sensitivity
          FILE_COUNT=$(ls testfile.txt TESTFILE.TXT 2>/dev/null | wc -l || echo "0")
          echo "FILESYSTEM_CASE_TEST_COUNT=$FILE_COUNT" >> $GITHUB_ENV

          if [ "$FILE_COUNT" -eq "2" ]; then
            echo "✅ Case-sensitive filesystem detected"
            echo "FILESYSTEM_IS_CASE_SENSITIVE=true" >> $GITHUB_ENV
          else
            echo "✅ Case-insensitive filesystem detected"
            echo "FILESYSTEM_IS_CASE_SENSITIVE=false" >> $GITHUB_ENV
          fi

          cd ../..
        shell: bash

      - name: Test filesystem behaviors
        run: |
          echo "🧪 Testing filesystem behaviors..."
          echo "Expected case sensitivity: ${{ matrix.filesystem-case }}"
          echo "Detected case sensitivity: $FILESYSTEM_IS_CASE_SENSITIVE"
          echo "File count in case test: $FILESYSTEM_CASE_TEST_COUNT"

          # Test path separators
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Testing Windows path separators..."
            # Test with both forward and back slashes
            echo "test content" > "test-filesystem\\path-test\\backslash.txt" || echo "Backslash path failed"
            echo "test content" > "test-filesystem/path-test/forward.txt" || echo "Forward slash path failed"
          else
            echo "Testing Unix-like path separators..."
            echo "test content" > "test-filesystem/path-test/unix.txt"
          fi

          # Test symbolic links (if supported)
          cd test-filesystem/symlink-test
          echo "original content" > original.txt
          ln -s original.txt symlink.txt 2>/dev/null || echo "Symlinks not supported on this filesystem"

          if [ -L symlink.txt ]; then
            echo "✅ Symbolic links supported"
            echo "FILESYSTEM_SUPPORTS_SYMLINKS=true" >> $GITHUB_ENV
          else
            echo "❌ Symbolic links not supported"
            echo "FILESYSTEM_SUPPORTS_SYMLINKS=false" >> $GITHUB_ENV
          fi

          cd ../..
        shell: bash

      # Node-version-aware, unlike the Build cache above: a test result cached under one Node version must never be replayed as if it verified another.
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ matrix.node-version }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-${{ matrix.node-version }}-

      - name: Run tests with OS-specific environment
        env:
          MARKMV_TEST_FILESYSTEM_CASE_SENSITIVE: ${{ env.FILESYSTEM_IS_CASE_SENSITIVE }}
          MARKMV_TEST_SUPPORTS_SYMLINKS: ${{ env.FILESYSTEM_SUPPORTS_SYMLINKS }}
        run: pnpm run test

      - name: Report filesystem test results
        run: |
          echo "## 🖥️ Filesystem Test Results - ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
          echo "**Node Version:** ${{ matrix.node-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Case Sensitivity:** $FILESYSTEM_IS_CASE_SENSITIVE" >> $GITHUB_STEP_SUMMARY
          echo "**Symlink Support:** $FILESYSTEM_SUPPORTS_SYMLINKS" >> $GITHUB_STEP_SUMMARY
          echo "**Path Separator:** ${{ matrix.path-separator || 'forward-slash' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      # Coverage generation (only on Node 24.x and Ubuntu to avoid duplication)
      - name: Generate test coverage
        if: matrix.node-version == '24.x' && matrix.os == 'ubuntu-latest'
        run: |
          pnpm run test:coverage | tee coverage-output.txt

          # Extract overall coverage percentage
          COVERAGE=$(grep "All files" coverage-output.txt | awk '{print $4}' | head -1)
          echo "TEST_COVERAGE=$COVERAGE" >> $GITHUB_ENV
          echo "📊 Test coverage: $COVERAGE%" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifacts
        if: matrix.node-version == '24.x' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            coverage/
            coverage-output.txt
          retention-days: 30

  # Release - only after every quality gate passes
  release:
    needs: [commitlint, lint, typecheck, build, knip, docs, audit, test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # OIDC identity for npm trusted publishing (no NPM_TOKEN)
      attestations: write # for actions/attest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          ref: main

      # pnpm must be on PATH before setup-node: its cache integration runs `pnpm store path` and fails if the package manager is not installed yet.
      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC trusted publishing (needs npm CLI >=11.5.1)
        run: npm install -g npm@latest

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          name: coverage-reports
        continue-on-error: true

      - name: Upload coverage to Coveralls
        if: hashFiles('coverage/lcov.info') != ''
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./coverage/lcov.info
        continue-on-error: true

      - name: Build
        run: pnpm run build

      - name: Verify build output
        run: |
          ls -la dist/
          node dist/cli.js --version || echo "CLI not yet ready"

      - name: Generate SBOM for NPM attestations
        uses: anchore/sbom-action@v0.24.0
        with:
          path: ./
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: true
          upload-release-assets: false

      # Provenance mode (bare subject-path, no sbom-path/predicate inputs): a verifiable chain-of-custody for the SBOM document itself. Attesting the SBOM in "SBOM mode" against the actual npm tarball as its subject would need that tarball packed before this point -- but the real publish, including the version bump, happens later inside `pnpm run release`, so a tarball packed here would carry a version that never actually ships. Signing the SBOM document's own provenance avoids attesting a fact that would already be wrong by the time the real package exists.
      - name: Attest SBOM
        uses: actions/attest@v4
        with:
          subject-path: sbom.spdx.json

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # npm publish provenance, matching the npm plugin's provenance setting in release.config.ts
          NPM_CONFIG_PROVENANCE: "true"
          # Blanked, not omitted -- an inherited NPM_TOKEN/NODE_AUTH_TOKEN from a workflow-level env block or composite action would otherwise be used in preference to the OIDC exchange.
          NPM_TOKEN: ""
          NODE_AUTH_TOKEN: ""
        run: pnpm run release

  # Documentation Deployment - Only after successful release with updated version
  documentation:
    needs: release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Get the latest commit (including version updates from release)
          ref: main
          fetch-depth: 1

      # pnpm must be on PATH before setup-node: its cache integration runs `pnpm store path` and fails if the package manager is not installed yet.
      - name: Setup pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .tool-versions
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build

      - name: Show current project status
        run: |
          echo "## 📊 Documentation Build Status" >> $GITHUB_STEP_SUMMARY
          echo "**Current Version:** $(node -p "require('./package.json').version")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Generate documentation
        run: pnpm run docs

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
