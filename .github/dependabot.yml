version: 2
updates:
  # Enable version updates for npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "ExaDev"
    assignees:
      - "ExaDev"
    commit-message:
      prefix: "build(deps)"
    groups:
      # Group patch updates together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group minor TypeScript ecosystem updates
      typescript-ecosystem:
        patterns:
          - "typescript*"
          - "@typescript-eslint/*"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"
      # Group testing dependencies
      testing-dependencies:
        patterns:
          - "vitest*"
          - "@vitest/*"
          - "eslint*"
          - "prettier*"
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    # Dependabot's file fetcher only looks for action.yml/action.yaml inside a configured directory itself, it does not walk into subdirectories of "/" looking for composite actions -- the pins inside .github/actions/setup/action.yml (pnpm/action-setup, actions/setup-node, actions/cache) need their own directory entry or Dependabot never proposes a bump for them at all.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "ExaDev"
    assignees:
      - "ExaDev"
    commit-message:
      prefix: "ci(deps)"
    groups:
      # Group all GitHub Actions updates together
      github-actions:
        patterns:
          - "*"
