# A newly published package version can't be installed until this many minutes have passed, giving a compromised release time to be caught and pulled before it reaches this project. 10080 minutes = 7 days, matching the global npm/pnpm min-release-age configured on this machine.
minimumReleaseAge: 10080

# ExaDev publishes this package itself, so its releases are exempt from the age gate meant for third-party packages.
minimumReleaseAgeExclude:
  - "@exadev/eslint-config"

# Moved from package.json's pnpm.overrides field -- pnpm 11 no longer reads settings from package.json's pnpm field.
overrides:
  rollup: 4.62.4
  fast-uri: 3.1.5
  js-yaml: 4.3.1
  fast-uri@>=3.1.3 <3.1.6: ">=3.1.6"
  fast-uri@>=3.0.0 <3.1.6: ">=3.1.6"
  fast-uri@>=3.1.2 <3.1.6: ">=3.1.6"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2"
  fast-uri@>=3.0.0 <3.1.7: ">=3.1.7"
  undici@>=7.0.0 <7.29.1: ">=7.29.1"
  undici@>=6.7.0 <6.28.1: ">=6.28.1"
  undici@>=7.24.1 <7.29.1: ">=7.29.1"
  brace-expansion@<1.1.20: ">=1.1.20"
  brace-expansion@>=2.0.0 <2.1.6: ">=2.1.6"
  brace-expansion@>=4.0.0 <5.0.11: ">=5.0.11"
  brace-expansion@<1.1.19: ">=1.1.19"
  brace-expansion@>=2.0.0 <2.1.5: ">=2.1.5"
  brace-expansion@>=4.0.0 <5.0.10: ">=5.0.10"

# Moved from .npmrc -- pnpm 11 restricts .npmrc to auth and registry settings; everything else lives here.
nodeLinker: hoisted
strictPeerDependencies: false
# esbuild's install script only selects and verifies its own platform-native binary (a transitive dependency of vitest/vite); it runs no other logic, so allowing it is safe.
allowBuilds:
  esbuild: true
